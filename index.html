<!DOCTYPE html>
<html lang="it">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardPlay Online - Blackjack</title>
    style.css  
</head>
<body>

<h1>

  <svg class="icon" viewBox="0 0 64 64" fill="white">
    <rect x="8" y="4" width="48" height="56" rx="6" ry="6" fill="white" stroke="black" stroke-width="2"/>
    <text x="14" y="22" font-size="14" fill="black" font-weight="bold">A</text>
    <text x="32" y="40" font-size="20" fill="black">♠</text>
  </svg>
  CardPlay Online - Blackjack

</h1>

<!-- Dobloni Display -->
<div class="dobloni-display">
  <svg viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="28" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#b8860b" stroke-width="2"/>
    <text x="32" y="40" font-size="24" fill="#8b6914" text-anchor="middle" font-weight="bold">D</text>
  </svg>
  <span id="dobloni-amount">1000</span> Dobloni
</div>

<div class="game">
    <h2>Giocatore</h2>
    <div id="player-cards" class="cards"></div>
    <p>Punteggio: <span id="player-score">0</span></p>

    <h2>Banco</h2>
    <div id="dealer-cards" class="cards"></div>
    <p>Punteggio: <span id="dealer-score">0</span></p>

    <div class="buttons">
        <button onclick="startGame()">Nuova Partita</button>
        <button onclick="drawCard()">Pesca Carta</button>
        <button onclick="stand()">Stai</button>
    </div>

    <h2 id="result"></h2>
</div>

<script src="script.js"></script>
</body>
</html>
