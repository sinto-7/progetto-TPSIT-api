<!DOCTYPE html>
<html lang="it">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardPlay Online - Blackjack</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>

<h1>

  <svg class="icon" viewBox="0 0 64 64" fill="white">
    <rect x="8" y="4" width="48" height="56" rx="6" ry="6" fill="white" stroke="black" stroke-width="2"/>
    <text x="14" y="22" font-size="14" fill="black" font-weight="bold">A</text>
    <text x="32" y="40" font-size="20" fill="black">♠</text>
  </svg>
  CardPlay Online - Blackjack

</h1>

<div class="game">
  <!-- Puntata -->
  <div id="betting-section" class="betting-section">
    <h3>Piazza la tua puntata</h3>
    <div class="bet-chips">
      <div class="chip chip-10" onclick="addBet(10)">10</div>
      <div class="chip chip-25" onclick="addBet(25)">25</div>
      <div class="chip chip-50" onclick="addBet(50)">50</div>
      <div class="chip chip-100" onclick="addBet(100)">100</div>
      <div class="chip chip-500" onclick="addBet(500)">500</div>
    </div>
    <div class="current-bet">Puntata: <span id="current-bet">0</span> Dobloni</div>
    <div class="bet-buttons">
      <button class="btn-clear" onclick="clearBet()">Cancella</button>
      <button class="btn-deal" onclick="deal()" id="deal-btn">Distribuisci</button>
    </div>
  </div>

    <!-- Dobloni Display -->
<div class="dobloni-display">
<svg viewBox="0 0 64 64">
<circle cx="32" cy="32" r="28" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
<circle cx="32" cy="32" r="22" fill="none" stroke="#b8860b" stroke-width="2"/>
<text x="32" y="40" font-size="24" fill="#8b6914" text-anchor="middle" font-weight="bold">D</text>
</svg>
<span id="dobloni-amount">1000</span> Dobloni
</div>

  <!-- Mano banco -->
  <div class="hand-section">
    <h2>Banco</h2>
    <div id="dealer-cards" class="cards"></div>
    <p class="score">Punteggio: <span id="dealer-score">-</span></p>
  </div>
 
  <!-- Mano giocatore -->
  <div id="player-section" class="hand-section">
    <h2>Giocatore</h2>
    <div id="player-hands-container">
      <div id="player-cards" class="cards"></div>
    </div>
    <p class="score">Punteggio: <span id="player-score">-</span></p>
  </div>
 
  <!-- Bottoni gioco -->
  <div id="game-buttons" class="buttons hidden">
    <button class="btn-hit" onclick="hit()" id="hit-btn">Carta</button>
    <button class="btn-stand" onclick="stand()" id="stand-btn">Stai</button>
    <button class="btn-double" onclick="doubleDown()" id="double-btn">Raddoppia</button>
    <button class="btn-split" onclick="split()" id="split-btn">Split</button>
  </div>
 
  <!-- Risultato -->
  <h2 id="result"></h2>
 
  <!-- Rigioca -->
  <div id="new-game-section" class="buttons hidden">
    <button class="btn-new" onclick="newRound()">Nuova Mano</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
